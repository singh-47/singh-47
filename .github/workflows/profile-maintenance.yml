name: Profile Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update maintenance log
        run: |
          echo "Last profile maintenance: $(date -u '+%Y-%m-%d %H:%M UTC')" > PROFILE_ACTIVITY.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROFILE_ACTIVITY.md
          git diff --cached --quiet || git commit -m "chore: update profile maintenance"
          git push
